<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Matches --dm-primary/--dm-primary-hover from the app's default theme.
         A favicon is a separate document (no access to the app's live CSS
         vars or palette picker), so it tracks light/dark via its own
         prefers-color-scheme, the one theme axis it can observe. -->
    <style>
      #g-a { stop-color: #005bc4; }
      #g-b { stop-color: #006fee; }
      @media (prefers-color-scheme: dark) {
        #g-a { stop-color: #66aaf9; }
        #g-b { stop-color: #338ef7; }
      }
    </style>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop id="g-a" offset="0"/>
      <stop id="g-b" offset="1"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g)"/>
  <rect width="64" height="64" rx="16" fill="url(#s)"/>
  <text x="32" y="34" text-anchor="middle" dominant-baseline="central"
        font-family="'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif"
        font-size="31" font-weight="700" letter-spacing="-2.5" fill="#ffffff">dm</text>
</svg>
