<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>@dmaster/ui · Modern Angular components</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Modern Angular UI components. Standalone, signals-based, zoneless-ready, themeable via CSS variables — with a clean, flat design language."
    />
    <link rel="canonical" href="https://dmasterui.com/" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="@dmaster/ui" />
    <meta property="og:title" content="@dmaster/ui · Modern Angular components" />
    <meta
      property="og:description"
      content="Modern Angular UI components. Standalone, signals-based, zoneless-ready, themeable via CSS variables."
    />
    <meta property="og:url" content="https://dmasterui.com/" />
    <meta property="og:image" content="https://dmasterui.com/social-preview.png" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="960" />
    <meta property="og:image:alt" content="@dmaster/ui — modern Angular component library" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="@dmaster/ui · Modern Angular components" />
    <meta
      name="twitter:description"
      content="Modern Angular UI components. Standalone, signals-based, zoneless-ready, themeable via CSS variables."
    />
    <meta name="twitter:image" content="https://dmasterui.com/social-preview.png" />

    <!-- Favicons: .ico + 48px PNG are what Google Search and older browsers use
         (SVG-only was showing the generic globe in search results); SVG is kept
         for modern browser tabs, apple-touch-icon for iOS home-screen. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols (all three families) powers font-mode dm-icon: <dm-icon>home</dm-icon> -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />

    <!-- Stamp the persisted theme before first paint to avoid a flash of the wrong theme. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ngx-dmaster-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-dm-theme', theme);
        } catch (e) {
          /* no-op: theme falls back to the app default */
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
