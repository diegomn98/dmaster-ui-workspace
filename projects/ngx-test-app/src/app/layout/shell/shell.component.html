<header class="shell__header">
  <div class="shell__header-group">
    <button
      type="button"
      class="shell__icon-btn shell__menu-btn"
      (click)="toggleSidebar()"
      [attr.aria-expanded]="sidebarOpen()"
      aria-controls="shell-sidebar"
      [attr.aria-label]="sidebarOpen() ? i18n.t().shell.closeNav : i18n.t().shell.openNav"
    >
      @if (sidebarOpen()) {
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      } @else {
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      }
    </button>

    <a routerLink="/" class="shell__brand" (click)="closeSidebar()">
      <svg class="shell__brand-mark" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="dm-logo-g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6366f1" />
            <stop offset="0.55" stop-color="#8b5cf6" />
            <stop offset="1" stop-color="#a855f7" />
          </linearGradient>
          <linearGradient id="dm-logo-s" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.22" />
            <stop offset="0.5" stop-color="#ffffff" stop-opacity="0" />
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="16" fill="url(#dm-logo-g)" />
        <rect width="64" height="64" rx="16" fill="url(#dm-logo-s)" />
        <text
          x="32"
          y="34"
          text-anchor="middle"
          dominant-baseline="central"
          font-family="'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif"
          font-size="31"
          font-weight="700"
          letter-spacing="-2.5"
          fill="#fff"
        >
          dm
        </text>
      </svg>
      <span class="shell__brand-name">dmaster/ui</span>
    </a>
  </div>

  <div class="shell__header-group">
    <app-palette-picker />

    <a
      class="shell__github"
      href="https://github.com/diegomn98/dmaster-ui"
      target="_blank"
      rel="noreferrer noopener"
      [attr.aria-label]="i18n.t().shell.githubAria"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          fill="currentColor"
          d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56v-2c-3.2.69-3.88-1.37-3.88-1.37-.52-1.34-1.28-1.7-1.28-1.7-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.68 0-1.25.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .97-.31 3.19 1.18a11.1 11.1 0 0 1 5.81 0c2.22-1.49 3.19-1.18 3.19-1.18.63 1.59.23 2.76.11 3.05.74.81 1.18 1.84 1.18 3.09 0 4.41-2.69 5.38-5.25 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"
        />
      </svg>
      <span class="shell__github-label">GitHub</span>
    </a>

    <dm-select
      class="shell__lang-select"
      variant="bordered"
      size="sm"
      [items]="locales"
      [value]="i18n.locale()"
      (valueChange)="onLocaleChange($event)"
      [ariaLabel]="i18n.t().shell.languageLabel"
    />

    <button
      type="button"
      class="shell__icon-btn"
      (click)="theme.toggle()"
      [attr.aria-label]="
        theme.resolvedTheme() === 'dark'
          ? i18n.t().shell.switchToLight
          : i18n.t().shell.switchToDark
      "
    >
      @if (theme.resolvedTheme() === 'dark') {
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"
          />
        </svg>
      } @else {
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
        </svg>
      }
    </button>
  </div>
</header>

<div class="shell__layout">
  @if (sidebarOpen()) {
    <div class="shell__backdrop" (click)="closeSidebar()" aria-hidden="true"></div>
  }

  <aside id="shell-sidebar" class="shell__sidebar" [class.shell__sidebar--open]="sidebarOpen()">
    <nav class="shell__nav" [attr.aria-label]="i18n.t().shell.navAria">
      @for (section of sections(); track section.label) {
        <section class="shell__nav-section">
          <h2 class="shell__nav-title">{{ section.label }}</h2>
          <ul class="shell__nav-list">
            @for (item of section.items; track item.path) {
              <li>
                <a
                  class="shell__nav-link"
                  [routerLink]="item.path"
                  routerLinkActive="shell__nav-link--active"
                  [routerLinkActiveOptions]="{ exact: true }"
                  (click)="closeSidebar()"
                >
                  {{ item.label }}
                </a>
              </li>
            }
          </ul>
        </section>
      }
    </nav>
  </aside>

  <main class="shell__main">
    <div class="shell__content">
      <router-outlet />
    </div>
  </main>

  <aside class="shell__toc-col">
    <app-toc />
  </aside>
</div>
