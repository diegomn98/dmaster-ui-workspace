<div class="c2">
  <div class="c2__scene">
    <div class="c2__term" data-safe="terminal">
      <div class="c2__bar">
        <span class="c2__dots"><i></i><i></i><i></i></span>
        <span class="c2__title">~/my-app</span>
      </div>
      <div class="c2__body">
        <span class="c2__line"><i class="c2__prompt">$</i> ng add &#64;dmaster/ui</span>
        <span class="c2__line"><i class="c2__ok">✔</i> Installed &#64;angular/cdk</span>
        <span class="c2__line"
          ><i class="c2__tag">UPDATE</i> angular.json
          <i class="c2__dim">overlay-prebuilt.css</i></span
        >
        <span class="c2__line"
          ><i class="c2__tag">UPDATE</i> src/styles.scss
          <i class="c2__dim">&#64;dmaster/ui/styles</i></span
        >
        <span class="c2__line c2__line--done"
          ><i class="c2__ok">✔</i> &#64;dmaster/ui is ready</span
        >
        <span class="c2__line"><i class="c2__prompt">$</i> <i class="c2__block"></i></span>
      </div>
    </div>

    <!-- lo que trae el paquete, flotando delante -->
    <span class="c2__chip" style="--dm-c2-y: 34px; --dm-c2-z: 90px">
      <i class="c2__chip-key">exports</i> ./styles/*
    </span>
    <span class="c2__chip" style="--dm-c2-y: 118px; --dm-c2-z: 150px">
      <i class="c2__chip-key">css</i> dmaster-ui.css
    </span>
    <span class="c2__chip" style="--dm-c2-y: 202px; --dm-c2-z: 110px">
      <i class="c2__chip-key">ssr</i> ThemeService ✓
    </span>
  </div>
</div>
