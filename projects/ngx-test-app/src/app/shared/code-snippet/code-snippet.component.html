<div class="snippet" [class.snippet--flat]="flat()" [attr.data-lang]="langKey() || null">
  @if (!flat()) {
    <header class="snippet__bar">
      @if (language()) {
        <span class="snippet__lang">
          <span class="snippet__lang-dot" aria-hidden="true"></span>
          {{ language() }}
        </span>
      }

      <dm-copy-button
        class="snippet__copy"
        [value]="code()"
        variant="bordered"
        size="sm"
        radius="full"
        [copyLabel]="i18n.t().shared.copy"
        [copiedLabel]="i18n.t().shared.copied"
        [ariaLabel]="i18n.t().shared.copyCode"
        [copiedAriaLabel]="i18n.t().shared.copied"
      />
    </header>
  } @else {
    <dm-copy-button
      class="snippet__copy snippet__copy--float"
      [value]="code()"
      variant="flat"
      size="sm"
      radius="md"
      [ariaLabel]="i18n.t().shared.copyCode"
      [copiedAriaLabel]="i18n.t().shared.copied"
    />
  }

  <pre class="snippet__pre" tabindex="0"><code [innerHTML]="highlighted()"></code></pre>
</div>
