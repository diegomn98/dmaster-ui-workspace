<figure class="demo" [class.demo--code]="activeTab() === 'code' && hasCode()">
  @if (heading() || hasCode()) {
    <header class="demo__header">
      @if (heading()) {
        <figcaption class="demo__title">{{ heading() }}</figcaption>
      }

      @if (hasCode()) {
        <span class="demo__tabs-wrap">
          <dm-tabs
            variant="segment"
            size="sm"
            radius="full"
            [fullWidth]="false"
            [divider]="false"
            [ariaLabel]="heading() || 'Example'"
            [selectedValue]="activeTab()"
            (selectedValueChange)="onTabChange($event)"
          >
            <dm-tab value="preview">
              <svg
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <span>{{ i18n.t().shared.previewLabel }}</span>
            </dm-tab>
            <dm-tab value="code">
              <svg
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m16 18 6-6-6-6M8 6l-6 6 6 6" />
              </svg>
              <span>{{ i18n.t().shared.codeLabel }}</span>
            </dm-tab>
          </dm-tabs>
        </span>
      }
    </header>
  }

  @if (activeTab() === 'preview' || !hasCode()) {
    <div class="demo__stage" role="tabpanel">
      <div class="demo__stage-content">
        <ng-content />
      </div>
    </div>
  } @else {
    <div class="demo__code" role="tabpanel">
      @if (snippets().length > 1) {
        <div class="demo__files" role="tablist" aria-label="File">
          @for (snippet of snippets(); track snippet.key) {
            <button
              type="button"
              role="tab"
              class="demo__file"
              [class.demo__file--active]="(activeFile() || snippets()[0].key) === snippet.key"
              [attr.aria-selected]="(activeFile() || snippets()[0].key) === snippet.key"
              [attr.tabindex]="(activeFile() || snippets()[0].key) === snippet.key ? 0 : -1"
              [attr.data-lang]="snippet.language"
              (click)="setFile(snippet.key)"
            >
              {{ snippet.label }}
            </button>
          }
        </div>
      }

      @if (activeSnippet(); as snippet) {
        <app-code-snippet [code]="snippet.code" [language]="snippet.language" [flat]="true" />
      }
    </div>
  }
</figure>
