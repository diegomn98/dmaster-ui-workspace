<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a94f5"/>
      <stop offset="1" stop-color="#006fee"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow-center" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#006fee" stop-opacity="0.14"/>
      <stop offset="0.7" stop-color="#006fee" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#006fee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-right" cx="0.8" cy="0.4" r="0.4">
      <stop offset="0" stop-color="#4a94f5" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#4a94f5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#ffffff" fill-opacity="0.035"/>
    </pattern>
    <filter id="shadow-sm" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="shadow-md" x="-6%" y="-6%" width="112%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="clip-card-1"><rect width="240" height="160" rx="14"/></clipPath>
    <clipPath id="clip-card-2"><rect width="220" height="140" rx="14"/></clipPath>
    <clipPath id="clip-card-3"><rect width="200" height="130" rx="14"/></clipPath>
    <clipPath id="clip-card-4"><rect width="230" height="150" rx="14"/></clipPath>
    <clipPath id="clip-card-5"><rect width="210" height="120" rx="14"/></clipPath>
    <clipPath id="clip-card-6"><rect width="200" height="110" rx="14"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="#09090b"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <ellipse cx="640" cy="320" rx="700" ry="400" fill="url(#glow-center)"/>
  <ellipse cx="1000" cy="280" rx="400" ry="300" fill="url(#glow-right)"/>

  <!-- ===== Component showcase cards (right 60%) ===== -->

  <!-- Card 1: Profile card (top-left of grid) -->
  <g transform="translate(530, 50)" filter="url(#shadow-md)">
    <rect width="240" height="160" rx="14" fill="#18181b"/>
    <g clip-path="url(#clip-card-1)">
      <!-- Avatar -->
      <circle cx="40" cy="44" r="22" fill="#1a72e0"/>
      <text x="40" y="49" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#ffffff">DM</text>
      <!-- Name + role -->
      <text x="72" y="38" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#e4e4e7">Diego Maestro</text>
      <text x="72" y="54" font-family="system-ui,sans-serif" font-size="11" fill="#71717a">Frontend Engineer</text>
      <!-- Badges -->
      <rect x="16" y="78" width="52" height="22" rx="11" fill="rgb(0 111 238 / 0.15)"/>
      <text x="42" y="93" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#4a94f5">Admin</text>
      <rect x="74" y="78" width="56" height="22" rx="11" fill="rgb(16 185 129 / 0.15)"/>
      <text x="102" y="93" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#34d399">Active</text>
      <!-- Button -->
      <rect x="16" y="116" width="208" height="30" rx="15" fill="#006fee"/>
      <text x="120" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#ffffff">Follow</text>
    </g>
  </g>

  <!-- Card 2: Form fields (top-right) -->
  <g transform="translate(790, 50)" filter="url(#shadow-md)">
    <rect width="220" height="140" rx="14" fill="#18181b"/>
    <g clip-path="url(#clip-card-2)">
      <!-- Label + Input -->
      <text x="16" y="30" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#a1a1aa">Email</text>
      <rect x="16" y="38" width="188" height="32" rx="8" fill="#27272a"/>
      <text x="28" y="58" font-family="system-ui,sans-serif" font-size="11" fill="#71717a">you@example.com</text>
      <!-- Label + Select -->
      <text x="16" y="88" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#a1a1aa">Role</text>
      <rect x="16" y="96" width="188" height="32" rx="8" fill="#27272a"/>
      <text x="28" y="116" font-family="system-ui,sans-serif" font-size="11" fill="#e4e4e7">Developer</text>
      <!-- Chevron -->
      <path d="M190 110 l4 4 l4 -4" stroke="#71717a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Card 3: Data table (middle-right) -->
  <g transform="translate(1030, 70)" filter="url(#shadow-sm)">
    <rect width="200" height="130" rx="14" fill="#18181b"/>
    <g clip-path="url(#clip-card-3)">
      <!-- Header row -->
      <rect x="0" y="0" width="200" height="32" rx="14" fill="#1f1f23"/>
      <text x="16" y="21" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#a1a1aa">Name</text>
      <text x="100" y="21" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#a1a1aa">Status</text>
      <!-- Row 1 -->
      <text x="16" y="52" font-family="system-ui,sans-serif" font-size="10" fill="#e4e4e7">api-server</text>
      <rect x="100" y="42" width="48" height="18" rx="9" fill="rgb(16 185 129 / 0.15)"/>
      <text x="124" y="55" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#34d399">Live</text>
      <!-- Row 2 -->
      <text x="16" y="76" font-family="system-ui,sans-serif" font-size="10" fill="#e4e4e7">dashboard</text>
      <rect x="100" y="66" width="48" height="18" rx="9" fill="rgb(0 111 238 / 0.15)"/>
      <text x="124" y="79" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#4a94f5">Build</text>
      <!-- Row 3 -->
      <text x="16" y="100" font-family="system-ui,sans-serif" font-size="10" fill="#e4e4e7">auth-svc</text>
      <rect x="100" y="90" width="48" height="18" rx="9" fill="rgb(16 185 129 / 0.15)"/>
      <text x="124" y="103" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#34d399">Live</text>
      <!-- Dividers -->
      <line x1="12" y1="62" x2="188" y2="62" stroke="#27272a" stroke-width="0.5"/>
      <line x1="12" y1="86" x2="188" y2="86" stroke="#27272a" stroke-width="0.5"/>
    </g>
  </g>

  <!-- Card 4: Settings with switches (middle-left of grid) -->
  <g transform="translate(580, 230)" filter="url(#shadow-md)">
    <rect width="230" height="150" rx="14" fill="#18181b"/>
    <g clip-path="url(#clip-card-4)">
      <text x="16" y="28" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#e4e4e7">Settings</text>
      <!-- Switch row 1 -->
      <text x="16" y="60" font-family="system-ui,sans-serif" font-size="11" fill="#a1a1aa">Dark mode</text>
      <rect x="174" y="47" width="36" height="20" rx="10" fill="#006fee"/>
      <circle cx="198" cy="57" r="7" fill="#ffffff"/>
      <!-- Switch row 2 -->
      <text x="16" y="90" font-family="system-ui,sans-serif" font-size="11" fill="#a1a1aa">Notifications</text>
      <rect x="174" y="77" width="36" height="20" rx="10" fill="#27272a"/>
      <circle cx="186" cy="87" r="7" fill="#52525b"/>
      <!-- Checkbox row -->
      <rect x="16" y="107" width="16" height="16" rx="4" fill="#006fee"/>
      <path d="M20 115 l3 3 l6 -7" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="40" y="120" font-family="system-ui,sans-serif" font-size="11" fill="#a1a1aa">Remember me</text>
    </g>
  </g>

  <!-- Card 5: Progress + slider (bottom-center) -->
  <g transform="translate(830, 220)" filter="url(#shadow-sm)">
    <rect width="210" height="120" rx="14" fill="#18181b"/>
    <g clip-path="url(#clip-card-5)">
      <text x="16" y="28" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#e4e4e7">Upload</text>
      <!-- Progress bar -->
      <rect x="16" y="42" width="178" height="6" rx="3" fill="#27272a"/>
      <rect x="16" y="42" width="128" height="6" rx="3" fill="url(#brand)"/>
      <text x="178" y="62" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" fill="#71717a">72%</text>
      <!-- Slider -->
      <text x="16" y="84" font-family="system-ui,sans-serif" font-size="11" fill="#a1a1aa">Volume</text>
      <rect x="16" y="94" width="178" height="4" rx="2" fill="#27272a"/>
      <rect x="16" y="94" width="110" height="4" rx="2" fill="#006fee"/>
      <circle cx="126" cy="96" r="7" fill="#006fee" stroke="#09090b" stroke-width="2"/>
    </g>
  </g>

  <!-- Card 6: Buttons showcase (bottom-right) -->
  <g transform="translate(1040, 230)" filter="url(#shadow-sm)">
    <rect width="200" height="110" rx="14" fill="#18181b"/>
    <g clip-path="url(#clip-card-6)">
      <!-- Solid button -->
      <rect x="14" y="14" width="80" height="30" rx="15" fill="#006fee"/>
      <text x="54" y="33" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#ffffff">Primary</text>
      <!-- Flat button -->
      <rect x="102" y="14" width="80" height="30" rx="15" fill="rgb(0 111 238 / 0.15)"/>
      <text x="142" y="33" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#4a94f5">Flat</text>
      <!-- Bordered button -->
      <rect x="14" y="54" width="80" height="30" rx="15" fill="none" stroke="#006fee" stroke-width="1.5"/>
      <text x="54" y="73" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#006fee">Bordered</text>
      <!-- Danger button -->
      <rect x="102" y="54" width="80" height="30" rx="15" fill="#e5145c"/>
      <text x="142" y="73" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#ffffff">Danger</text>
    </g>
  </g>

  <!-- Floating accent elements -->
  <!-- Date picker hint (bottom-left of component area) -->
  <g transform="translate(620, 415)" opacity="0.7" filter="url(#shadow-sm)">
    <rect width="170" height="100" rx="12" fill="#18181b"/>
    <!-- Calendar grid hint -->
    <text x="85" y="22" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#a1a1aa">August</text>
    <!-- Day numbers -->
    <text x="24" y="44" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#71717a">18</text>
    <text x="50" y="44" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#71717a">19</text>
    <circle cx="76" cy="40" r="12" fill="#006fee"/>
    <text x="76" y="44" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#ffffff">20</text>
    <text x="102" y="44" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#71717a">21</text>
    <text x="128" y="44" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#71717a">22</text>
    <text x="150" y="44" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#71717a">23</text>
    <!-- Row 2 -->
    <text x="24" y="66" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#71717a">25</text>
    <text x="50" y="66" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#71717a">26</text>
    <text x="76" y="66" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#71717a">27</text>
    <text x="102" y="66" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#71717a">28</text>
    <text x="128" y="66" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#71717a">29</text>
    <text x="150" y="66" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#71717a">30</text>
    <!-- Row 3 -->
    <text x="24" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#3f3f46">1</text>
    <text x="50" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#3f3f46">2</text>
    <text x="76" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#3f3f46">3</text>
  </g>

  <!-- Toast hint (bottom-right) -->
  <g transform="translate(800, 380)" opacity="0.6" filter="url(#shadow-sm)">
    <rect width="210" height="44" rx="12" fill="#18181b" stroke="#27272a" stroke-width="0.5"/>
    <!-- Check icon circle -->
    <circle cx="30" cy="22" r="10" fill="rgb(16 185 129 / 0.15)"/>
    <path d="M25 22 l3 3 l6 -7" stroke="#34d399" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="19" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#e4e4e7">Changes saved</text>
    <text x="48" y="33" font-family="system-ui,sans-serif" font-size="10" fill="#71717a">Your settings were updated</text>
  </g>

  <!-- ===== Brand / identity (left side) ===== -->

  <!-- Logo tile -->
  <g transform="translate(60, 120)">
    <rect width="120" height="120" rx="30" fill="url(#brand)"/>
    <rect width="120" height="120" rx="30" fill="url(#sheen)"/>
    <text x="60" y="66" text-anchor="middle" dominant-baseline="central"
          font-family="'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif"
          font-size="60" font-weight="700" letter-spacing="-4" fill="#ffffff">dm</text>
  </g>

  <!-- Title -->
  <text x="200" y="168" font-family="'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif"
        font-size="52" font-weight="700" letter-spacing="-2" fill="#ffffff">@dmaster/ui</text>

  <!-- Subtitle / tagline -->
  <text x="60" y="300" font-family="'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif"
        font-size="26" font-weight="500" letter-spacing="-0.5" fill="#a1a1aa">Build Angular apps with speed</text>

  <!-- Feature pills (timeless, no numbers) -->
  <g transform="translate(60, 340)">
    <rect x="0" y="0" width="100" height="32" rx="16" fill="rgb(0 111 238 / 0.10)" stroke="rgb(0 111 238 / 0.20)" stroke-width="1"/>
    <text x="50" y="17" text-anchor="middle" dominant-baseline="central"
          font-family="'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif"
          font-size="12" font-weight="600" fill="#4a94f5">Signals</text>

    <rect x="112" y="0" width="110" height="32" rx="16" fill="rgb(0 111 238 / 0.10)" stroke="rgb(0 111 238 / 0.20)" stroke-width="1"/>
    <text x="167" y="17" text-anchor="middle" dominant-baseline="central"
          font-family="'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif"
          font-size="12" font-weight="600" fill="#4a94f5">Dark mode</text>

    <rect x="234" y="0" width="120" height="32" rx="16" fill="rgb(16 185 129 / 0.10)" stroke="rgb(16 185 129 / 0.20)" stroke-width="1"/>
    <text x="294" y="17" text-anchor="middle" dominant-baseline="central"
          font-family="'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif"
          font-size="12" font-weight="600" fill="#34d399">Accessible</text>

    <rect x="366" y="0" width="108" height="32" rx="16" fill="rgb(0 111 238 / 0.10)" stroke="rgb(0 111 238 / 0.20)" stroke-width="1"/>
    <text x="420" y="17" text-anchor="middle" dominant-baseline="central"
          font-family="'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif"
          font-size="12" font-weight="600" fill="#4a94f5">Zoneless</text>
  </g>

  <!-- Angular badge -->
  <g transform="translate(60, 400)">
    <rect width="120" height="30" rx="15" fill="rgb(221 74 87 / 0.12)" stroke="rgb(221 74 87 / 0.25)" stroke-width="1"/>
    <text x="60" y="16" text-anchor="middle" dominant-baseline="central"
          font-family="'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif"
          font-size="12" font-weight="600" fill="#dd4a57">Angular 20+</text>
  </g>

  <!-- URL -->
  <text x="60" y="480" font-family="'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif"
        font-size="15" font-weight="500" letter-spacing="0.3" fill="#52525b">dmasterui.com</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="634" width="1280" height="6" fill="url(#brand)"/>
</svg>
