<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#8b5cf6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="#09090b"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <ellipse cx="380" cy="320" rx="560" ry="360" fill="url(#glow)"/>

  <g transform="translate(120, 200)">
    <rect width="240" height="240" rx="52" fill="url(#brand)"/>
    <rect width="240" height="240" rx="52" fill="url(#sheen)"/>
    <text x="120" y="132" text-anchor="middle" dominant-baseline="central"
          font-family="'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif"
          font-size="118" font-weight="700" letter-spacing="-9" fill="#ffffff">dm</text>
  </g>

  <g transform="translate(440, 258)">
    <text x="0" y="0"
          font-family="'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif"
          font-size="76" font-weight="700" letter-spacing="-2.5" fill="url(#title)">@dmaster/ui</text>
    <text x="0" y="56"
          font-family="'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif"
          font-size="30" font-weight="500" letter-spacing="-0.2" fill="#a1a1aa">Modern Angular components</text>
    <text x="0" y="96"
          font-family="'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif"
          font-size="22" font-weight="400" letter-spacing="0" fill="#71717a">Flat &amp; pill-radius · signals · dark mode · zero dependencies</text>
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="196" height="40" rx="20"
            fill="rgb(99 102 241 / 0.15)"
            stroke="rgb(99 102 241 / 0.35)" stroke-width="1"/>
      <text x="98" y="21" text-anchor="middle" dominant-baseline="central"
            font-family="'Inter','Segoe UI',system-ui,-apple-system,Arial,sans-serif"
            font-size="15" font-weight="600" letter-spacing="0.1" fill="#c7d2fe">Angular 20+</text>
    </g>
  </g>
</svg>
