name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:app
      - run: npm run lint
      - run: npm run lint:styles
      - run: npm run format:check

      - name: Publish to npm
        run: cd dist/dmaster-ui && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push library source to dmaster-ui repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add lib-origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/diegomn98/dmaster-ui.git
          git subtree push --prefix=projects/ngx-dmaster-ui lib-origin main
