name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write # npm provenance (Sigstore attestation) needs OIDC

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # The tag must match the library version — refuse to publish a mismatch.
      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./projects/ngx-dmaster-ui/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match @dmaster/ui version $PKG_VERSION"
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm run build:app
      - run: npm test
      - run: npm run test:app
      - run: npm run lint
      - run: npm run lint:styles
      - run: npm run format:check
      - run: npx publint dist/dmaster-ui

      - name: Publish to npm (with signed provenance)
        run: cd dist/dmaster-ui && npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --title "@dmaster/ui $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push library source to dmaster-ui repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add lib-origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/diegomn98/dmaster-ui.git
          git subtree push --prefix=projects/ngx-dmaster-ui lib-origin main
