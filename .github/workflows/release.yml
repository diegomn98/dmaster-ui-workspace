name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the GitHub Release + push the source mirror
  # The signed npm publish (and its OIDC/id-token) now runs in the dmaster-ui
  # repo — see projects/ngx-dmaster-ui/.github/workflows/publish.yml.

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      # The tag must match the library version — refuse to publish a mismatch.
      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./projects/ngx-dmaster-ui/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match @dmaster/ui version $PKG_VERSION"
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm run build:app
      - run: npm test
      - run: npm run test:app
      - run: npm run lint
      - run: npm run lint:styles
      - run: npm run format:check
      - run: npx publint dist/dmaster-ui

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --title "@dmaster/ui $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push library source to dmaster-ui repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add lib-origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/diegomn98/dmaster-ui.git
          git subtree push --prefix=projects/ngx-dmaster-ui lib-origin main

      # npm provenance ties the published repository.url to the repo whose OIDC
      # identity runs `npm publish`. Publishing from dmaster-ui is what lets
      # @dmaster/ui declare repository.url = dmaster-ui while keeping a signed,
      # transparent attestation. The subtree push above has just delivered the
      # publish workflow to dmaster-ui; this dispatch triggers it for this tag.
      - name: Trigger the signed npm publish from the dmaster-ui repo
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/diegomn98/dmaster-ui/dispatches \
            -d "{\"event_type\":\"publish\",\"client_payload\":{\"ref\":\"${GITHUB_REF_NAME}\"}}"
