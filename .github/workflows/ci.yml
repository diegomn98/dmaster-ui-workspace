name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npm run test:app
      - run: npm run lint
      - run: npm run lint:styles
      - run: npm run format:check
