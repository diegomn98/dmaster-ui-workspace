name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Library: ng-packagr + precompiled CSS + ng-add schematics
      - run: npm run build

      # Docs app: full static prerender (also smoke-tests SSR safety of the lib)
      - run: npm run build:app

      - run: npm test
      - run: npm run test:app
      - run: npm run lint
      - run: npm run lint:styles
      - run: npm run format:check

      # Validate the publishable package layout (exports, files, types)
      - run: npx publint dist/dmaster-ui
