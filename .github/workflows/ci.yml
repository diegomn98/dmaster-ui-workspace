name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Library: ng-packagr + precompiled CSS + ng-add schematics
      - run: npm run build

      # Docs app: full static prerender (also smoke-tests SSR safety of the lib)
      - run: npm run build:app

      - run: npm test
      - run: npm run test:app
      - run: npm run lint
      - run: npm run lint:styles
      - run: npm run format:check

      # Validate the publishable package layout (exports, files, types)
      - run: npx publint dist/dmaster-ui

  # Consumer-perspective check: pack the built library and build a real, isolated
  # Angular app against the tarball (examples/starter). Catches packaging /
  # exports / peer-dep / type-resolution problems that never surface inside the
  # monorepo (whose tsconfig points @dmaster/ui at source). Runs in parallel.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Builds the library, packs it, installs it into examples/starter and
      # builds that app. Fails if the published package wouldn't work.
      - run: npm run verify:package
